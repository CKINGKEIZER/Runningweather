<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Finder | RunWeather</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --text: #1e293b; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .wrapper { max-width: 700px; width: 100%; }
        .card { 
            background: white; padding: 1.5rem; border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
        }
        h1 { margin: 0 0 0.5rem; text-align: center; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem; }
        
        .search-container { position: relative; margin-bottom: 1rem; }
        input[type="text"] { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; box-sizing: border-box; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; margin-top: 5px; }
        .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
        
        #map { height: 400px; width: 100%; border-radius: 16px; margin-bottom: 1rem; z-index: 1; }
        
        .controls { display: grid; gap: 15px; margin-bottom: 15px; }
        button.action-btn { background: var(--text); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; width: 100%; cursor: pointer; }
        button.action-btn:disabled { opacity: 0.5; }
        
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .nav-btn { text-decoration: none; padding: 12px; text-align: center; border-radius: 12px; font-weight: 600; background: #f8fafc; color: var(--text); }
        .nav-btn.active { background: #eff6ff; color: var(--secondary); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h1>Route Finder</h1>
        <p class="subtitle">Search city. Set start point. Generate loop.</p>

        <div class="search-container">
            <input type="text" id="city-input" placeholder="Search city (e.g. London)" autocomplete="off">
            <div id="suggestions" class="suggestions"></div>
        </div>

        <div id="map"></div>

        <div class="controls">
            <div>
                <label style="font-weight:600; color:#3a7bd5;">Distance: <span id="dist-val">5.0</span> km</label>
                <input type="range" id="dist-slider" min="1" max="21" step="0.5" value="5" style="width:100%;">
            </div>
            <button id="gen-btn" class="action-btn" onclick="generateRoute()">Generate Loop</button>
        </div>

        <div id="stats" style="text-align:center; font-weight:bold; color:#64748b;"></div>

        <div class="nav-buttons">
            <a href="index.html" class="nav-btn">Time Planner</a>
            <a href="route.html" class="nav-btn active">Route Finder</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // ---------------------------------------------------------
    // ---------------------------------------------------------

    let map, startMarker, routeLayer;
    let selectedLat = null, selectedLng = null;
    let debounceTimer;
    const ROUTE_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 days

function routeCacheKey(lat, lng, km) {
  return `routeCache:${lat.toFixed(5)},${lng.toFixed(5)}:${km.toFixed(1)}`;
}

function loadCachedRoute(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.savedAt || !obj.geojson) return null;
    if ((Date.now() - obj.savedAt) > ROUTE_CACHE_TTL_MS) return null;
    return obj.geojson;
  } catch {
    return null;
  }
}

function saveCachedRoute(key, geojson) {
  try {
    localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), geojson }));
  } catch {
    // ignore quota errors
  }
}

    
    // Init Map
    map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

     // 1. Check LocalStorage First
    const savedLoc = localStorage.getItem('userLocation');
    
    if (savedLoc) {
        const data = JSON.parse(savedLoc);
        // Set variables
        selectedLat = data.lat;
        selectedLng = data.lon; // Note: 'lon' became 'lng' in your route variable
        
        // Update Input & Map
        document.getElementById('city-input').value = data.name;
        map.setView([selectedLat, selectedLng], 14);
        setStartPoint(selectedLat, selectedLng);
        
    } else if (navigator.geolocation) {
        // 2. Fallback to Geolocation if no saved city
        navigator.geolocation.getCurrentPosition(pos => {
            if(!selectedLat) { // Only if we haven't loaded from storage
                map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                setStartPoint(pos.coords.latitude, pos.coords.longitude);
            }
        });
    }

    // Search
    const input = document.getElementById('city-input');
    const suggestionsBox = document.getElementById('suggestions');
    input.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        if (e.target.value.length < 3) { suggestionsBox.style.display = 'none'; return; }
        debounceTimer = setTimeout(async () => {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${e.target.value}&count=5&language=en&format=json`);
            const data = await res.json();
            suggestionsBox.innerHTML = data.results ? data.results.map(p =>
        `<div class="suggestion-item" onclick="selectCity('${p.name}', ${p.latitude}, ${p.longitude}, '${p.timezone || ''}')">
            <strong>${p.name}</strong>, ${p.country}
        </div>`
        ).join('') : '';

            suggestionsBox.style.display = 'block';
        }, 300);
    });

        function selectCity(name, lat, lon, timezone) {
    input.value = name;
    suggestionsBox.style.display = 'none';
    map.setView([lat, lon], 14);
    setStartPoint(lat, lon);

    // Preserve timezone if we have it, otherwise keep existing saved timezone
    const existing = localStorage.getItem('userLocation');
    const existingTz = existing ? (JSON.parse(existing).timezone || null) : null;

    const locationData = { name, lat, lon, timezone: timezone || existingTz };
    localStorage.setItem('userLocation', JSON.stringify(locationData));
    }



    map.on('click', e => setStartPoint(e.latlng.lat, e.latlng.lng));

    function setStartPoint(lat, lng) {
  selectedLat = lat;
  selectedLng = lng;

  if (startMarker) map.removeLayer(startMarker);
  startMarker = L.marker([lat, lng], { draggable: true }).addTo(map);

  // Update start coords after dragging
  startMarker.on('dragend', () => {
    const p = startMarker.getLatLng();
    selectedLat = p.lat;
    selectedLng = p.lng;
    if (routeLayer) map.removeLayer(routeLayer);
    document.getElementById('stats').innerText = "";
  });

  if (routeLayer) map.removeLayer(routeLayer);
  document.getElementById('stats').innerText = "";
}


    document.getElementById('dist-slider').addEventListener('input', e => {
        document.getElementById('dist-val').innerText = parseFloat(e.target.value).toFixed(1);
    });

    // Helper function to analyze route quality
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function turnAngleDeg(a, b, c) {
  // a,b,c are [lon, lat]
  const latRad = b[1] * Math.PI / 180;

  const v1x = (b[0] - a[0]) * Math.cos(latRad);
  const v1y = (b[1] - a[1]);
  const v2x = (c[0] - b[0]) * Math.cos(latRad);
  const v2y = (c[1] - b[1]);

  const dot = v1x * v2x + v1y * v2y;
  const m1 = Math.hypot(v1x, v1y);
  const m2 = Math.hypot(v2x, v2y);
  if (m1 === 0 || m2 === 0) return 0;

  const cos = Math.max(-1, Math.min(1, dot / (m1 * m2)));
  return Math.acos(cos) * (180 / Math.PI); // 0..180
}

function analyzeRouteQuality(coords) {
  if (!coords || coords.length < 4) {
    return { backtrackScore: 1, backtrackCount: 0, closureMeters: Infinity, valid: false };
  }

  let backtrackCount = 0;
  let totalTurns = 0;

  for (let i = 2; i < coords.length; i++) {
    const ang = turnAngleDeg(coords[i - 2], coords[i - 1], coords[i]);
    totalTurns++;
    if (ang > 160) backtrackCount++;
  }

  const backtrackScore = totalTurns > 0 ? backtrackCount / totalTurns : 1;

  const start = coords[0];
  const end = coords[coords.length - 1];
  const closureMeters = haversineMeters(start[1], start[0], end[1], end[0]);

  // Thresholds tuned for “running loop”
  const valid = backtrackScore < 0.12 && closureMeters < 150;

  return { backtrackScore, backtrackCount, closureMeters, valid };
}

function clamp(x, lo, hi) {
  return Math.max(lo, Math.min(hi, x));
}

function stableSeed(lat, lng, km) {
  // Deterministic, stable per start + distance
  const a = Math.floor((lat + 90) * 10000);
  const b = Math.floor((lng + 180) * 10000);
  const c = Math.floor(km * 10);
  let s = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
  s = (s >>> 0) % 1000000000;
  return s;
}

async function generateRoute() {
  if (!selectedLat) return alert("Click map to set start.");

  const targetKm = parseFloat(document.getElementById('dist-slider').value);
  const cacheKey = routeCacheKey(selectedLat, selectedLng, targetKm);
  const cached = loadCachedRoute(cacheKey);

  if (cached) {
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(cached, { style: { color: '#3a7bd5', weight: 5, opacity: 0.8 } }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

    const summary = cached.features[0].properties.summary;
    const finalDistKm = (summary.distance / 1000).toFixed(2);
    const runningTimeMin = Math.round((summary.distance / 1000) / 10 * 60);
    document.getElementById('stats').innerHTML = `${finalDistKm} km • ${runningTimeMin} min (10 km/h)`;
    return;
  }
    
    const btn = document.getElementById('gen-btn');
    const stats = document.getElementById('stats');
    btn.disabled = true; 
    btn.innerText = "Finding best route...";
    
    if (routeLayer) map.removeLayer(routeLayer);

    const targetDistanceMeters = targetKm * 1000;

    
    const url = '/api/ors';

    let bestRoute = null;
    let bestScore = Infinity;
    const maxAttempts = 5; // Try 5 different seeds
    
    try {
        // Try multiple route variations
        const pointsPlan = [4, 5, 3, 5, 4];              // explore shape, but still “loop-first”
        let lengthFactor = 0.88;                         // starting guess, then adapt
        const base = stableSeed(selectedLat, selectedLng, targetKm);

        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const pointCount = pointsPlan[attempt] || 4;
          const adjustedDistance = Math.round(targetDistanceMeters * lengthFactor);
          const seed = (base + attempt * 97) % 1000000000;

          const body = {
            coordinates: [[selectedLng, selectedLat]],
            options: {
              // Optional, improves “pleasantness” for foot profiles without extra calls
              // Weightings supported for foot-* profiles. :contentReference[oaicite:2]{index=2}
              profile_params: { weightings: { green: 1, quiet: 1 } },
              round_trip: { length: adjustedDistance, points: pointCount, seed: seed }
            }
          };

          const res = await fetch(url, {
            method: 'POST',
            headers: {
        'Content-Type': 'application/json'
        },

            body: JSON.stringify(body)
          });


            if (!res.ok) continue; // Skip failed attempts
            
            const data = await res.json();
            
            if (!data.features || data.features.length === 0) continue;
            
            const coords = data.features[0].geometry.coordinates;
            const summary = data.features[0].properties.summary;
            const actualDistKm = summary.distance / 1000;

            // Adapt lengthFactor for next attempt (no extra requests, smarter use of 5 attempts)
            if (actualDistKm > 0.5) {
              const ratio = targetKm / actualDistKm;
              lengthFactor = clamp(lengthFactor * ratio, 0.65, 1.10);
            }

            const quality = analyzeRouteQuality(coords);
            const distanceError = Math.abs(actualDistKm - targetKm) / targetKm;

            // Score: backtracking dominates, then closure, then distance accuracy
            const closurePenalty = clamp(quality.closureMeters / 50, 0, 10); // 0..10 roughly
            const score = (quality.backtrackScore * 120) + (closurePenalty * 5) + (distanceError * 60);

            
            console.log(`Attempt ${attempt + 1}: ${pointCount} points, ${actualDistKm.toFixed(2)}km, backtrack: ${quality.backtrackCount}, score: ${score.toFixed(2)}`);
            
            // Keep the best route
            if (quality.valid && score < bestScore) {
                bestScore = score;
                bestRoute = data;
            }
            
            // If we found an excellent route early, stop searching
            if (quality.backtrackCount === 0 && distanceError < 0.15) {
                console.log("Found excellent route early!");
                break;
            }
        }
        
        if (!bestRoute) {
            throw new Error("Could not find a suitable loop. Try a different location or distance.");
        }
        saveCachedRoute(cacheKey, bestRoute);

        // Render the best route
        routeLayer = L.geoJSON(bestRoute, {
            style: { color: '#3a7bd5', weight: 5, opacity: 0.8 }
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

                const summary = bestRoute.features[0].properties.summary;
        const finalDistKm = (summary.distance / 1000).toFixed(2);
        
        // Calculate running time: (Distance in km / 10 km/h) * 60 minutes
        const runningTimeMin = Math.round((summary.distance / 1000) / 10 * 60);
        
        // Update stats with new format
        stats.innerHTML = `${finalDistKm} km • ${runningTimeMin} min (10 km/h)`;

    } catch (e) {
        console.error("Route Error:", e);
        alert("Error generating loop: " + e.message);
        stats.innerHTML = "Route failed";
    } finally {
        btn.disabled = false; 
        btn.innerText = "Generate Loop";
    }
}

</script>
</body>
</html>
