<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // ---------------------------------------------------------
    // ---------------------------------------------------------

    let map, startMarker, routeLayer;
    let lastGeneratedRoute = null;
    let selectedLat = null, selectedLng = null;
    let debounceTimer;
    const ROUTE_CACHE_TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 days
    const ROUTE_ALGO_VERSION = "v3";

function routeCacheKey(lat, lng, km) {
  return `routeCache:${ROUTE_ALGO_VERSION}:${lat.toFixed(5)},${lng.toFixed(5)}:${km.toFixed(1)}`;
}


function loadCachedRoute(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.savedAt || !obj.geojson) return null;
    if ((Date.now() - obj.savedAt) > ROUTE_CACHE_TTL_MS) return null;
    return obj.geojson;
  } catch {
    return null;
  }
}

function saveCachedRoute(key, geojson) {
  try {
    localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), geojson }));
  } catch {
    // ignore quota errors
  }
}
    // Init Map
    map = L.map('map').setView([51.505, -0.09], 13);
    
    // CHANGED: Added crossOrigin: true to allow screenshots// Init Map
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '&copy; OpenStreetMap',
        crossOrigin: true 
    }).addTo(map);

     // 1. Check LocalStorage First
    const savedLoc = localStorage.getItem('userLocation');
    
    if (savedLoc) {
        const data = JSON.parse(savedLoc);
        // Set variables
        selectedLat = data.lat;
        selectedLng = data.lon; // Note: 'lon' became 'lng' in your route variable
        
        // Update Input & Map
        document.getElementById('city-input').value = data.name;
        map.setView([selectedLat, selectedLng], 14);
        setStartPoint(selectedLat, selectedLng);
        
    } else if (navigator.geolocation) {
        // 2. Fallback to Geolocation if no saved city
        navigator.geolocation.getCurrentPosition(pos => {
            if(!selectedLat) { // Only if we haven't loaded from storage
                map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                setStartPoint(pos.coords.latitude, pos.coords.longitude);
            }
        });
    }

    // Search
    const input = document.getElementById('city-input');
    const suggestionsBox = document.getElementById('suggestions');
    input.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        if (e.target.value.length < 3) { suggestionsBox.style.display = 'none'; return; }
        debounceTimer = setTimeout(async () => {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${e.target.value}&count=5&language=en&format=json`);
            const data = await res.json();
            suggestionsBox.innerHTML = data.results ? data.results.map(p =>
        `<div class="suggestion-item" onclick="selectCity('${p.name}', ${p.latitude}, ${p.longitude}, '${p.timezone || ''}')">
            <strong>${p.name}</strong>, ${p.country}
        </div>`
        ).join('') : '';

            suggestionsBox.style.display = 'block';
        }, 300);
    });

        function selectCity(name, lat, lon, timezone) {
    input.value = name;
    suggestionsBox.style.display = 'none';
    map.setView([lat, lon], 14);
    setStartPoint(lat, lon);

    // Preserve timezone if we have it, otherwise keep existing saved timezone
    const existing = localStorage.getItem('userLocation');
    const existingTz = existing ? (JSON.parse(existing).timezone || null) : null;

    const locationData = { name, lat, lon, timezone: timezone || existingTz };
    localStorage.setItem('userLocation', JSON.stringify(locationData));
    }

    map.on('click', e => setStartPoint(e.latlng.lat, e.latlng.lng));

    function setStartPoint(lat, lng) {
  selectedLat = lat;
  selectedLng = lng;

  if (startMarker) map.removeLayer(startMarker);
  startMarker = L.marker([lat, lng], { draggable: true }).addTo(map);

  // Update start coords after dragging
  startMarker.on('dragend', () => {
    const p = startMarker.getLatLng();
    selectedLat = p.lat;
    selectedLng = p.lng;
    if (routeLayer) map.removeLayer(routeLayer);
    document.getElementById('stats').innerText = "";
  });

  if (routeLayer) map.removeLayer(routeLayer);
  document.getElementById('stats').innerText = "";
}


    document.getElementById('dist-slider').addEventListener('input', e => {
        document.getElementById('dist-val').innerText = parseFloat(e.target.value).toFixed(1);
    });

    // Helper function to analyze route quality
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (x) => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function turnAngleDeg(a, b, c) {
  // a,b,c are [lon, lat]
  const latRad = b[1] * Math.PI / 180;

  const v1x = (b[0] - a[0]) * Math.cos(latRad);
  const v1y = (b[1] - a[1]);
  const v2x = (c[0] - b[0]) * Math.cos(latRad);
  const v2y = (c[1] - b[1]);

  const dot = v1x * v2x + v1y * v2y;
  const m1 = Math.hypot(v1x, v1y);
  const m2 = Math.hypot(v2x, v2y);
  if (m1 === 0 || m2 === 0) return 0;

  const cos = Math.max(-1, Math.min(1, dot / (m1 * m2)));
  return Math.acos(cos) * (180 / Math.PI); // 0..180
}

function analyzeRouteQuality(coords) {
  if (!coords || coords.length < 4) {
    return { backtrackScore: 1, backtrackCount: 0, closureMeters: Infinity, valid: false };
  }

  let backtrackCount = 0;
  let totalTurns = 0;

  for (let i = 2; i < coords.length; i++) {
    const ang = turnAngleDeg(coords[i - 2], coords[i - 1], coords[i]);
    totalTurns++;
    if (ang > 160) backtrackCount++;
  }

  const backtrackScore = totalTurns > 0 ? backtrackCount / totalTurns : 1;

  const start = coords[0];
  const end = coords[coords.length - 1];
  const closureMeters = haversineMeters(start[1], start[0], end[1], end[0]);

  // Thresholds tuned for “running loop”
  const valid = backtrackScore < 0.12 && closureMeters < 150;

  return { backtrackScore, backtrackCount, closureMeters, valid };
}

function clamp(x, lo, hi) {
  return Math.max(lo, Math.min(hi, x));
}

function overlapStats(coords) {
  if (!coords || coords.length < 12) {
    return { overlapRatio: 1, uniqueRatio: 0, revisits: 0, samples: 0 };
  }

  const cellSizeM = 25; // larger cell catches “same road” better
  const lat0 = coords[0][1] * Math.PI / 180;
  const mPerDegLat = 111320;
  const mPerDegLon = 111320 * Math.cos(lat0);

  const seen = new Map();
  let revisits = 0;
  let samples = 0;

  const step = 1; // sample every point
  const minGap = Math.max(12, Math.floor(coords.length * 0.15)); // adaptive

  for (let i = 0; i < coords.length; i += step) {
    samples++;
    const lon = coords[i][0];
    const lat = coords[i][1];

    const x = lon * mPerDegLon;
    const y = lat * mPerDegLat;

    const cx = Math.round(x / cellSizeM);
    const cy = Math.round(y / cellSizeM);
    const key = `${cx}:${cy}`;

    const prev = seen.get(key);
    if (prev !== undefined) {
      if ((i - prev) > minGap) revisits++;
    } else {
      seen.set(key, i);
    }
  }

  const overlapRatio = samples ? (revisits / samples) : 1;
  const uniqueRatio = samples ? (seen.size / samples) : 0;
  return { overlapRatio, uniqueRatio, revisits, samples };
}


function stableSeed(lat, lng, km) {
  // Deterministic, stable per start + distance
  const a = Math.floor((lat + 90) * 10000);
  const b = Math.floor((lng + 180) * 10000);
  const c = Math.floor(km * 10);
  let s = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
  s = (s >>> 0) % 1000000000;
  return s;
}

function renderRoute(geojson) {
    if (routeLayer) map.removeLayer(routeLayer);

    routeLayer = L.geoJSON(geojson, {
        style: { color: '#3a7bd5', weight: 5, opacity: 0.8 }
    }).addTo(map);

    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

    const summary = geojson.features[0].properties.summary;
    const finalDistKm = (summary.distance / 1000).toFixed(2);
    
    // Calculate running time: (Distance in km / 10 km/h) * 60 minutes
    const runningTimeMin = Math.round((summary.distance / 1000) / 10 * 60);

    // Update stats
    document.getElementById('stats').innerHTML = `${finalDistKm} km • ${runningTimeMin} min (10 km/h)`;
}

// ---------------------------------------------------------
// Helper: Ramer-Douglas-Peucker Simplification
// Removes noise vertices (like crosswalk zigzags) that deviate 
// less than 'epsilon' degrees from the main line.
// ---------------------------------------------------------
function simplifyCoords(points, epsilon) {
    if (points.length <= 2) return points;

    let dmax = 0;
    let index = 0;
    const end = points.length - 1;

    // Find the point with the maximum distance from line segment [start, end]
    for (let i = 1; i < end; i++) {
        const d = perpendicularDist(points[i], points[0], points[end]);
        if (d > dmax) {
            index = i;
            dmax = d;
        }
    }

    // If max distance is greater than epsilon, recursively simplify
    if (dmax > epsilon) {
        const res1 = simplifyCoords(points.slice(0, index + 1), epsilon);
        const res2 = simplifyCoords(points.slice(index), epsilon);
        return res1.slice(0, res1.length - 1).concat(res2);
    } 
    
    // Else discard intermediate points
    return [points[0], points[end]];
}

// Distance from point p to line defined by p1 and p2 (squared euclidean approx for speed)
function perpendicularDist(p, p1, p2) {
    let x = p[0], y = p[1];
    let x1 = p1[0], y1 = p1[1];
    let x2 = p2[0], y2 = p2[1];

    if (x1 === x2 && y1 === y2) {
        return Math.sqrt((x - x1) ** 2 + (y - y1) ** 2);
    }

    const num = Math.abs((y2 - y1) * x - (x2 - x1) * y + x2 * y1 - y2 * x1);
    const den = Math.sqrt((y2 - y1) ** 2 + (x2 - x1) ** 2);
    return num / den;
}

// ---------------------------------------------------------
// Helper: Detour Remover
// Detects inefficient "spikes" (like crossing a street and back).
// If A->B->C is > 3x longer than A->C, we skip B.
// ---------------------------------------------------------
function removeDetours(coords) {
    if (!coords || coords.length < 3) return coords;
    
    const clean = [coords[0]]; // Always keep start
    
    // We look ahead. If we skip a point, we continue from the *previous* valid point.
    for (let i = 1; i < coords.length - 1; i++) {
        const prev = clean[clean.length - 1];
        const curr = coords[i];
        const next = coords[i+1];

        const d1 = haversineMeters(prev[1], prev[0], curr[1], curr[0]);
        const d2 = haversineMeters(curr[1], curr[0], next[1], next[0]);
        const direct = haversineMeters(prev[1], prev[0], next[1], next[0]);
        
        const pathDist = d1 + d2;
        
        // THE LOGIC:
        // 1. Is it a huge detour? (Path is > 3x the direct distance)
        // 2. Is the detour relatively small? (< 150m total) - prevents cutting off real lakes/buildings
        // 3. Is the direct path very short? (< 20m) - snaps micro-jitters
        const isInefficient = (pathDist > (direct * 3)) && (pathDist < 150);
        const isNoise = (direct < 15) && (pathDist > direct * 1.5);

        if (!isInefficient && !isNoise) {
            clean.push(curr);
        }
    }
    
    clean.push(coords[coords.length - 1]); // Always keep end
    return clean;
}

async function generateRoute() {
    if (!selectedLat) return alert("Click map to set start.");

    const targetKm = parseFloat(document.getElementById('dist-slider').value);
    const cacheKey = routeCacheKey(selectedLat, selectedLng, targetKm);
    
  // 1. Check Cache
    const cached = loadCachedRoute(cacheKey);
    if (cached) {
        lastGeneratedRoute = cached; // <--- THIS IS THE NEW LINE
        renderRoute(cached);
        return;
    }

    // 2. Prepare UI
    const btn = document.getElementById('gen-btn');
    const stats = document.getElementById('stats');
    btn.disabled = true;
    btn.innerText = "Optimizing distance...";
    if (routeLayer) map.removeLayer(routeLayer);

    const targetDistanceMeters = targetKm * 1000;
    const maxAttempts = 6; 
    
    let bestRoute = null;
    let bestScore = Infinity;
    
    let lengthFactor = 1.0; 
    const baseSeed = stableSeed(selectedLat, selectedLng, targetKm);

    try {
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            const seed = (baseSeed + attempt * 73) % 1000000000;
            
            const adjustedDistance = Math.round(targetDistanceMeters * clamp(lengthFactor, 0.2, 3.5));
            const pointsVal = 4 + Math.floor(attempt / 2); 

            const body = {
                coordinates: [[selectedLng, selectedLat]],
                options: {
                    avoid_features: ["fords", "ferries", "steps"],
                    round_trip: { 
                        length: adjustedDistance, 
                        points: pointsVal, 
                        seed: seed 
                    }
                }
            };

            // 3. API Call
            let data;
            try {
                const res = await fetch('/api/ors', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                if (!res.ok) continue; 
                data = await res.json();
            } catch (err) {
                console.warn(`Attempt ${attempt} failed:`, err);
                continue;
            }

            if (!data.features || data.features.length === 0) continue;

            // -------------------------------------------------------
            // 4. Analysis & Simplification (UPDATED)
            // -------------------------------------------------------
            const rawCoords = data.features[0].geometry.coordinates;

            // STEP A: Kill the "monstrosities" (inefficient zigzags) first
            const detouredCoords = removeDetours(rawCoords);

            // STEP B: Smooth the remaining lines (RDP algorithm)
            // Increased epsilon slightly to 0.00015 (approx 15m) for better road snapping
            const coords = simplifyCoords(detouredCoords, 0.00015);
            
            // Overwrite geometry
            data.features[0].geometry.coordinates = coords;

            // Recalculate distance
            let newDistMeters = 0;
            for(let i=0; i<coords.length-1; i++) {
                 newDistMeters += haversineMeters(coords[i][1], coords[i][0], coords[i+1][1], coords[i+1][0]);
            }
            // Update the data object's properties
            data.features[0].properties.summary.distance = newDistMeters;
            
            // Use the NEW distance for logic
            const actualDistKm = newDistMeters / 1000;
            
            const safeTarget = targetKm > 0 ? targetKm : 5;
            const distDiff = Math.abs(actualDistKm - safeTarget);
            const distanceError = distDiff / safeTarget;
            
            const quality = analyzeRouteQuality(coords);
            const ov = overlapStats(coords);

            // FEEDBACK LOOP
            if (actualDistKm > 0.1) {
                const correction = safeTarget / actualDistKm;
                lengthFactor = lengthFactor * (0.5 + (0.5 * correction));
            }

            // 5. Scoring
            const score = 
                (distanceError * 5000) +       
                (ov.overlapRatio * 2000) +     
                (quality.closureMeters * 5);   

            console.log(`Attempt ${attempt}: Req=${(adjustedDistance/1000).toFixed(1)}km | Act=${actualDistKm.toFixed(2)}km | Pts=${pointsVal} | Score=${Math.round(score)}`);

            if (!bestRoute || score < bestScore) {
                bestScore = score;
                bestRoute = data;
                lastGeneratedRoute = data; // <--- THIS IS THE NEW LINE
            }

            // 6. Strict Success Criteria
            const isAccurate = distDiff < 0.3; 
            const isClean = ov.overlapRatio < 0.05 && quality.closureMeters < 150;

            if (isAccurate && isClean) break;
        }

        if (!bestRoute) {
            throw new Error("Unable to generate valid geometry.");
        }

        const bestCoords = bestRoute.features[0].geometry.coordinates;
        const bestOv = overlapStats(bestCoords);
        const bestSummary = bestRoute.features[0].properties.summary;
        const bestDiff = Math.abs((bestSummary.distance/1000) - targetKm);
        
        if (bestDiff < (targetKm * 0.1) && bestOv.overlapRatio < 0.10) {
            saveCachedRoute(cacheKey, bestRoute);
        }

        renderRoute(bestRoute);

    } catch (e) {
        console.error("Route Error:", e);
        stats.innerHTML = "Optimization failed. Try a different start point.";
        alert(e.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Generate Loop";
    }
}
// ---------------------------------------------------------
// Feature: Screenshot / Download Image
// Initialize the plugin (Wrapped in try-catch to prevent crash if plugin fails to load)
let screenshoter;
try {
    if (typeof L.simpleMapScreenshoter !== 'undefined') {
        screenshoter = L.simpleMapScreenshoter({ hidden: true }).addTo(map);
    }
} catch (e) { console.warn("Screenshot plugin failed:", e); }

function downloadImage() {
    if (!routeLayer) return alert("Generate a route first.");
    
    // Force the map to fit the route perfectly before snapping
    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    
    screenshoter.takeScreen('image')
        .then(blob => {
            const link = document.createElement('a');
            link.download = `RunWeather_Route_${new Date().toISOString().slice(0,10)}.png`;
            link.href = URL.createObjectURL(blob);
            link.click();
        })
        .catch(e => {
            console.error(e);
            alert("Error creating image. Note: This feature requires a web server (localhost or https) to handle cross-origin map tiles.");
        });
}
function toggleSavedRoutes() {
    const list = document.getElementById('saved-list');
    const arrow = document.getElementById('saved-arrow');
    const isHidden = list.style.display === 'none';

    if (isHidden) {
        list.style.display = 'block';
        arrow.classList.remove('collapsed');
    } else {
        list.style.display = 'none';
        arrow.classList.add('collapsed');
    }
}
// ---------------------------------------------------------
// Feature: Save / Load Favorites (LocalStorage)
// ---------------------------------------------------------
function saveRoute() {
    if (!routeLayer || !lastGeneratedRoute) return alert("No route to save.");
    
    const favorites = JSON.parse(localStorage.getItem('favoriteRoutes') || '[]');
    const summary = lastGeneratedRoute.features[0].properties.summary;
    const dist = (summary.distance / 1000).toFixed(2);
    
    const newSave = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        city: document.getElementById('city-input').value,
        dist: dist,
        geojson: lastGeneratedRoute
    };
    
    favorites.unshift(newSave); // Add to top
    localStorage.setItem('favoriteRoutes', JSON.stringify(favorites));
    renderFavorites();
}

function loadFavorite(id) {
        const favorites = JSON.parse(localStorage.getItem('favoriteRoutes') || '[]');
        const item = favorites.find(x => x.id === id);
        if (item) {
            // 1. Set the global variable so we can save it again if needed
            lastGeneratedRoute = item.geojson; 
            
            // 2. Set the start marker FIRST (this clears any existing route)
            const lat = item.geojson.features[0].geometry.coordinates[0][1];
            const lng = item.geojson.features[0].geometry.coordinates[0][0];
            setStartPoint(lat, lng);

            // 3. Render the route AFTER the marker is set
            renderRoute(item.geojson);
        }
    }

function deleteFavorite(id, event) {
    event.stopPropagation(); // prevent clicking the row
    let favorites = JSON.parse(localStorage.getItem('favoriteRoutes') || '[]');
    favorites = favorites.filter(x => x.id !== id);
    localStorage.setItem('favoriteRoutes', JSON.stringify(favorites));
    renderFavorites();
}

function renderFavorites() {
    const list = document.getElementById('saved-list');
    const favorites = JSON.parse(localStorage.getItem('favoriteRoutes') || '[]');
    
    if (favorites.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8; font-size:0.9rem;">No saved routes yet.</p>';
        return;
    }

    list.innerHTML = favorites.map(item => `
        <div class="saved-item" onclick="loadFavorite(${item.id})">
            <div>
                <strong>${item.dist} km</strong> in ${item.city}
                <div style="font-size:0.8rem; color:#64748b;">${item.date}</div>
            </div>
            <div class="delete-btn" onclick="deleteFavorite(${item.id}, event)">✕</div>
        </div>
    `).join('');
}

// Initial render on page load
renderFavorites();

</script>
