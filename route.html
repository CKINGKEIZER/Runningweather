<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Finder | RunWeather</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --text: #1e293b; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        .wrapper { max-width: 700px; width: 100%; }
        
        .card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
        }

        h1 { margin: 0 0 0.5rem; text-align: center; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem; }

        /* SEARCH STYLES */
        .search-container { position: relative; margin-bottom: 1rem; }
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 1rem; 
            outline: none; 
            box-sizing: border-box; 
        }
        input[type="text"]:focus { border-color: var(--secondary); }
        
        .suggestions { 
            position: absolute; 
            top: 100%; left: 0; right: 0; 
            background: white; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            max-height: 200px; 
            overflow-y: auto; 
            z-index: 1000; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            display: none; 
            margin-top: 5px; 
        }
        .suggestion-item { 
            padding: 10px 15px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            border-bottom: 1px solid #f1f5f9; 
            color: #333; 
            text-align: left;
        }
        .suggestion-item:hover { background: #f8fafc; color: var(--secondary); }

        /* Map Container */
        #map { 
            height: 400px; 
            width: 100%; 
            border-radius: 16px; 
            margin-bottom: 1rem; 
            border: 2px solid #e2e8f0;
            cursor: crosshair;
            z-index: 1; /* Lower than suggestions */
        }

        /* Controls */
        .controls { 
            display: grid; 
            gap: 15px; 
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-weight: 600; font-size: 0.9rem; color: var(--secondary); }
        
        input[type="range"] { width: 100%; accent-color: var(--secondary); }
        
        button.action-btn { 
            background: var(--text); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 600; 
            width: 100%; 
            cursor: pointer;
            font-size: 1rem;
        }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Nav Buttons */
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .nav-btn {
            text-decoration: none;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: #f8fafc;
            color: var(--text);
            border: 2px solid transparent;
        }
        .nav-btn:hover { background: #e2e8f0; }
        .nav-btn.active { background: #eff6ff; border-color: var(--secondary); color: var(--secondary); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h1>Route Finder</h1>
        <p class="subtitle">Search city. Set start point. Generate loop.</p>

        <div class="search-container">
            <input type="text" id="city-input" placeholder="Search city (e.g. London)" autocomplete="off">
            <div id="suggestions" class="suggestions"></div>
        </div>

        <div id="map"></div>

        <div class="controls">
            <div class="control-group">
                <label>Distance Goal: <span id="dist-val">5.0</span> km</label>
                <input type="range" id="dist-slider" min="1" max="21" step="0.5" value="5">
            </div>
            
            <button id="gen-btn" class="action-btn" onclick="generateRoute()">Generate Loop</button>
        </div>

        <div id="stats" style="text-align:center; font-weight:bold; color:#64748b; margin-bottom:10px;"></div>

        <div class="nav-buttons">
            <a href="index.html" class="nav-btn">Time Planner</a>
            <a href="route.html" class="nav-btn active">Route Finder</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // --- API CONFIGURATION ---
    const API_KEY = '1d9dab904b9f3f53a9c3f5182f09e956nU6hpMh08zo'; 
    // -------------------------

    let map, startMarker, routeLayer;
    let selectedLat = null;
    let selectedLng = null;
    let debounceTimer;

    const input = document.getElementById('city-input');
    const suggestionsBox = document.getElementById('suggestions');

    // 1. Initialize Map
    map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 2. Geolocation
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            if (!selectedLat) {
                map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                setStartPoint(pos.coords.latitude, pos.coords.longitude);
            }
        });
    }

    // 3. Autocomplete Logic
    input.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const query = e.target.value;
        if (query.length < 3) { suggestionsBox.style.display = 'none'; return; }
        
        debounceTimer = setTimeout(async () => {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=en&format=json`);
            const data = await res.json();
            renderSuggestions(data.results);
        }, 300);
    });

    function renderSuggestions(results) {
        if (!results) return;
        suggestionsBox.innerHTML = results.map(place => 
            `<div class="suggestion-item" onclick="selectCity('${place.name}', ${place.latitude}, ${place.longitude})">
                <strong>${place.name}</strong>, ${place.country}
            </div>`
        ).join('');
        suggestionsBox.style.display = 'block';
    }

    function selectCity(name, lat, lon) {
        input.value = name;
        suggestionsBox.style.display = 'none';
        map.setView([lat, lon], 14);
        setStartPoint(lat, lon);
    }

    // 4. Map Interactions
    map.on('click', function(e) {
        setStartPoint(e.latlng.lat, e.latlng.lng);
    });

    function setStartPoint(lat, lng) {
        selectedLat = lat;
        selectedLng = lng;

        if (startMarker) map.removeLayer(startMarker);
        
        startMarker = L.marker([lat, lng], {draggable: true}).addTo(map);
        startMarker.bindPopup("Start Here").openPopup();

        startMarker.on('dragend', function(event) {
            const position = event.target.getLatLng();
            selectedLat = position.lat;
            selectedLng = position.lng;
        });

        if (routeLayer) map.removeLayer(routeLayer);
        document.getElementById('stats').innerText = "";
    }

    // 5. Slider
    document.getElementById('dist-slider').addEventListener('input', (e) => {
        document.getElementById('dist-val').innerText = parseFloat(e.target.value).toFixed(1);
    });

    // 6. Generate Route (PROXY ENABLED)
    async function generateRoute() {
        if (!selectedLat) { alert("Please click the map to set a start point."); return; }

        const btn = document.getElementById('gen-btn');
        const stats = document.getElementById('stats');
        
        btn.disabled = true;
        btn.innerText = "Calculating...";
        stats.innerText = "";

        if (routeLayer) map.removeLayer(routeLayer);

        const distMeters = parseFloat(document.getElementById('dist-slider').value) * 1000;
        const seed = Math.floor(Math.random() * 100);

        // API URL (with Key in URL)
        const targetUrl = `https://api.openrouteservice.org/v2/directions/foot-walking/geojson?api_key=${API_KEY}`;
        
        // Proxy URL (Bypasses Browser Security)
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    coordinates: [[selectedLng, selectedLat]],
                    options: {
                        round_trip: {
                            length: distMeters,
                            points: 3,
                            seed: seed
                        }
                    }
                })
            });

            if (!response.ok) {
                // If proxy works but API rejects (e.g. invalid key)
                if (response.status === 403 || response.status === 401) {
                    throw new Error("API Key Invalid. Please check your OpenRouteService dashboard.");
                }
                const errText = await response.text();
                throw new Error(`Server Error ${response.status}: ${errText}`);
            }

            const data = await response.json();
            
            // Validate route existence
            if (!data.features || data.features.length === 0) {
                 throw new Error("No route found. Try a different location (avoid water).");
            }

            routeLayer = L.geoJSON(data, {
                style: { color: '#3a7bd5', weight: 5, opacity: 0.7 }
            }).addTo(map);
            
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            const props = data.features[0].properties;
            stats.innerHTML = `Route: ${(props.summary.distance / 1000).toFixed(2)} km <br> Est. Walking: ${Math.round(props.summary.duration / 60)} min`;

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate Loop";
        }
    }
</script>

</body>
</html>
