<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Finder | RunWeather</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --text: #1e293b; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        .wrapper { max-width: 700px; width: 100%; }
        
        .card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
        }

        h1 { margin: 0 0 0.5rem; text-align: center; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem; }

        /* Map Container */
        #map { 
            height: 400px; 
            width: 100%; 
            border-radius: 16px; 
            margin-bottom: 1rem; 
            border: 2px solid #e2e8f0;
            cursor: crosshair; /* Indicates they should click */
        }

        /* Controls */
        .controls { 
            display: grid; 
            gap: 15px; 
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label { font-weight: 600; font-size: 0.9rem; color: var(--secondary); }
        
        input[type="range"] { width: 100%; accent-color: var(--secondary); }
        
        .dist-display { 
            font-size: 1.2rem; 
            font-weight: 800; 
            color: var(--text); 
            text-align: center;
        }

        button.action-btn { 
            background: var(--text); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 600; 
            width: 100%; 
            cursor: pointer;
            font-size: 1rem;
        }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Nav Buttons (Consistent with Index) */
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .nav-btn {
            text-decoration: none;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: #f8fafc;
            color: var(--text);
            border: 2px solid transparent;
        }
        .nav-btn:hover { background: #e2e8f0; }
        .nav-btn.active { background: #eff6ff; border-color: var(--secondary); color: var(--secondary); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h1>Route Finder</h1>
        <p class="subtitle">Click map to set start point. Select distance.</p>

        <div id="map"></div>

        <div class="controls">
            <div class="control-group">
                <label>Distance Goal: <span id="dist-val">5.0</span> km</label>
                <input type="range" id="dist-slider" min="1" max="21" step="0.5" value="5">
            </div>
            
            <button id="gen-btn" class="action-btn" onclick="generateRoute()">Generate Loop</button>
        </div>

        <div id="stats" style="text-align:center; font-weight:bold; color:#64748b; margin-bottom:10px;"></div>

        <div class="nav-buttons">
            <a href="index.html" class="nav-btn">Time Planner</a>
            <a href="route.html" class="nav-btn active">Route Finder</a>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    // --- CONFIGURATION ---
   const API_KEY = '1d9dab904b9f3f53a9c3f5182f09e956nU6hpMh08zo'; // <--- PASTE KEY HERE
    // ---------------------

    let map, startMarker, routeLayer;
    let selectedLat = null;
    let selectedLng = null;

    // 1. Initialize Map
    // Default to a central location (e.g., London) until geolocation runs
    map = L.map('map').setView([51.505, -0.09], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 2. Try to get user location immediately
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            map.setView([lat, lng], 14);
            setStartPoint(lat, lng);
        });
    }

    // 3. Map Click Listener
    map.on('click', function(e) {
        setStartPoint(e.latlng.lat, e.latlng.lng);
    });

    function setStartPoint(lat, lng) {
        selectedLat = lat;
        selectedLng = lng;

        // Remove old marker
        if (startMarker) map.removeLayer(startMarker);
        
        // Add new marker
        startMarker = L.marker([lat, lng], {draggable: true}).addTo(map);
        startMarker.bindPopup("Start Here").openPopup();

        // Update when dragged
        startMarker.on('dragend', function(event) {
            const position = event.target.getLatLng();
            selectedLat = position.lat;
            selectedLng = position.lng;
        });

        // Clear previous route if exists
        if (routeLayer) map.removeLayer(routeLayer);
        document.getElementById('stats').innerText = "";
    }

    // 4. Update Slider Text
    document.getElementById('dist-slider').addEventListener('input', (e) => {
        document.getElementById('dist-val').innerText = parseFloat(e.target.value).toFixed(1);
    });

    // 5. Generate Route
    async function generateRoute() {
        if (!selectedLat || !API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
            alert("Error: Please set a start point and add your API Key in the code.");
            return;
        }

        const btn = document.getElementById('gen-btn');
        const stats = document.getElementById('stats');
        
        btn.disabled = true;
        btn.innerText = "Calculating...";
        stats.innerText = "";

        if (routeLayer) map.removeLayer(routeLayer);

        const distKm = parseFloat(document.getElementById('dist-slider').value);
        // ORS expects meters
        const distMeters = distKm * 1000;
        
        // Seed ensures randomness. 
        const seed = Math.floor(Math.random() * 100);

        // API Endpoint for Round Trip
        // Profile: foot-walking (avoids highways, prefers runnable paths)
        const url = `https://api.openrouteservice.org/v2/directions/foot-walking/geojson`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    'Authorization': API_KEY
                },
                body: JSON.stringify({
                    coordinates: [[selectedLng, selectedLat]],
                    options: {
                        round_trip: {
                            length: distMeters,
                            points: 3, // Number of points in the polygon to generate loop
                            seed: seed
                        }
                    }
                })
            });

            if (!response.ok) throw new Error("API Limit or Error");

            const data = await response.json();

            // Render Route
            routeLayer = L.geoJSON(data, {
                style: { color: '#3a7bd5', weight: 5, opacity: 0.7 }
            }).addTo(map);

            // Fit map to show full route
            map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });

            // Show Stats
            const props = data.features[0].properties;
            const actualDist = (props.summary.distance / 1000).toFixed(2);
            const duration = Math.round(props.summary.duration / 60); // minutes
            
            stats.innerHTML = `Route: ${actualDist} km <br> Est. Walking: ${duration} min`;

        } catch (error) {
            console.error(error);
            alert("Could not generate route. Ensure API key is valid and start point is on land.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Generate Loop";
        }
    }
</script>

</body>
</html>
