<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hour | Running Weather</title>
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --bg: #f8fafc; --text: #1e293b; --error: #ef4444; }
        body { font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); max-width: 440px; width: 100%; text-align: center; }
        h1 { margin: 0 0 0.5rem; font-size: 1.75rem; font-weight: 800; }
        .subtitle { color: #64748b; margin-bottom: 2rem; font-size: 0.95rem; }
        
        /* Input Styling */
        .input-group { margin-bottom: 1.5rem; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        #display-area { min-height: 150px; display: flex; flex-direction: column; justify-content: center; }
        .result-box { background: #f0f9ff; padding: 1.5rem; border-radius: 16px; margin-bottom: 1.5rem; border: 2px solid var(--primary); }
        .time { font-size: 2.25rem; font-weight: 900; color: var(--secondary); }
        .stats { font-size: 0.85rem; font-weight: 600; color: #475569; margin-top: 8px; }
        
        button { background: var(--text); color: white; border: none; padding: 14px 28px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        
        .bmc { margin-top: 2rem; display: inline-block; color: #64748b; text-decoration: none; font-size: 0.8rem; border-top: 1px solid #eee; padding-top: 1rem; width: 100%; }
        .error-msg { color: var(--error); font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Golden Hour</h1>
    <p class="subtitle">Find the best running window in the next 12 hours.</p>
    
    <div class="input-group">
        <input type="text" id="city-input" placeholder="Enter city (e.g. London)" onkeypress="handleEnter(event)">
    </div>

    <div id="display-area">
        <button onclick="getWeatherByCity()">Find Window</button>
        <p id="error-text" class="error-msg"></p>
    </div>
    
    <a class="bmc" href="https://www.buymeacoffee.com">☕ Buy me a coffee</a>
</div>

<script>
// Allow "Enter" key to trigger search
function handleEnter(e) {
    if (e.key === 'Enter') getWeatherByCity();
}

async function getWeatherByCity() {
    const cityInput = document.getElementById('city-input').value.trim();
    const display = document.getElementById('display-area');
    const errorText = document.getElementById('error-text');
    
    // reset UI
    errorText.style.display = 'none';
    
    if (!cityInput) {
        errorText.innerText = "Please enter a city name.";
        errorText.style.display = 'block';
        return;
    }

    // Show loading state, keeping the input field visible
    const originalContent = display.innerHTML;
    display.innerHTML = '<p style="color:#64748b; font-style:italic;">Searching location...</p>';

    try {
        // Step 1: Geocoding (City -> Lat/Long)
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityInput)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
            throw new Error("City not found");
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        // Step 2: Weather Fetch (Lat/Long -> Forecast)
        display.innerHTML = '<p style="color:#64748b; font-style:italic;">Analyzing weather...</p>';
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=apparent_temperature,precipitation_probability,wind_speed_10m&forecast_days=1`);
        const data = await weatherRes.json();

        // Step 3: Analysis Logic
        const hours = data.hourly.time.slice(0, 12).map((t, i) => {
            const temp = data.hourly.apparent_temperature[i];
            const precip = data.hourly.precipitation_probability[i];
            const wind = data.hourly.wind_speed_10m[i];
            // Score: Ideal 10°C, <15kph wind, 0% rain
            let score = 100 - (Math.abs(temp - 10) * 2) - (precip * 0.8) - (wind * 0.6);
            return { time: new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), temp, precip, wind, score };
        });

        const best = hours.sort((a, b) => b.score - a.score)[0];

        // Step 4: Display Result
        display.innerHTML = `
            <div class="result-box">
                <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b;">Best Time in ${name}</div>
                <div class="time">${best.time}</div>
                <div class="stats">${best.temp.toFixed(1)}°C | ${best.precip}% Rain | ${best.wind.toFixed(1)} km/h</div>
            </div>
            <button onclick="location.reload()">Check Another City</button>
        `;

    } catch (e) {
        // Restore button and show error
        display.innerHTML = `
            <button onclick="getWeatherByCity()">Find Window</button>
            <p class="error-msg" style="display:block">Could not find "${cityInput}". Try a major city nearby.</p>
        `;
    }
}
</script>
</body>
</html>
