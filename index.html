<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunWeather | Golden Hour Running Planner</title>
    
    <meta name="description" content="Stop guessing. AI-powered weather analysis to find the perfect running window in your city.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Golden Hour | Find Your Perfect Run">
    <meta property="og:description" content="Don't run in the rain. Find the best 60-minute window based on wind, temp, and air quality.">
    <meta property="og:url" content="https://www.runweather.org/">

    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --accent: #ff9a9e; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; box-sizing: border-box; }
        
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); max-width: 440px; width: 100%; position: relative; transition: all 0.3s ease; }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 800; text-align: center; }
        .subtitle { color: #64748b; margin-bottom: 1.5rem; font-size: 0.9rem; text-align: center; }

        /* Autocomplete Styling */
        .search-container { position: relative; margin-bottom: 1rem; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--secondary); }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: none; margin-top: 5px; }
        .suggestion-item { padding: 10px 15px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; text-align: left; }
        .suggestion-item:hover { background: #f8fafc; color: var(--secondary); }

        /* Main Controls */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .full-width { grid-column: span 2; }
        
        button { background: #f1f5f9; color: var(--text); border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; border: 2px solid transparent; }
        button:hover { background: #e2e8f0; }
        button.active { background: #eff6ff; border-color: var(--secondary); color: var(--secondary); }
        
        /* Sub Controls */
        #sub-controls { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; animation: fadeIn 0.3s ease; }
        .sub-btn { font-size: 0.8rem; padding: 8px 4px; line-height: 1.3; }
        .sub-time { display: block; font-size: 0.7em; opacity: 0.7; font-weight: normal; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        button.primary { background: var(--text); color: white; margin-top: 5px; padding: 14px; width: 100%; }
        
        /* Results & Commentary */
        #result-area { margin-top: 20px; display: none; }
        .result-box { background: #f0f9ff; padding: 1.5rem; border-radius: 16px; border: 2px solid var(--secondary); text-align: center; position: relative; }
        .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--secondary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .time { font-size: 2rem; font-weight: 900; color: var(--secondary); margin: 10px 0; }
        .meta { font-size: 0.85rem; color: #64748b; margin-top: 5px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        
        /* Badges Container */
        .badges-container { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; }
        
        /* Specific Badge Colors */
        .sunset-badge { background: #fff1f2; color: #e11d48; }
        .hydro-badge { background: #dbeafe; color: #2563eb; }
        .aqi-good { background: #dcfce7; color: #166534; }    /* Green */
        .aqi-fair { background: #fef9c3; color: #854d0e; }    /* Yellow */
        .aqi-poor { background: #fee2e2; color: #991b1b; }    /* Red */

        /* Dynamic Comment Style */
        .comment { margin-top: 15px; font-size: 1rem; font-style: italic; color: #334155; font-weight: 500; border-top: 1px solid #cbd5e1; padding-top: 12px; line-height: 1.4; }
        
        .bmc { display: block; text-align: center; margin-top: 2rem; color: #94a3b8; font-size: 0.8rem; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Run Planner</h1>
    <p class="subtitle">Find your perfect weather window.</p>
    
    <div class="search-container">
        <input type="text" id="city-input" placeholder="Search city (e.g. Austin)" autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="action-grid" id="controls">
        <button class="mode-btn active" onclick="setMode('asap', this)">⚡ ASAP</button>
        <button class="mode-btn" onclick="setMode('tonight', this)">🌙 Tonight</button>
        <button class="mode-btn full-width" onclick="setMode('3day', this)">📅 Best in 3 Days</button>
    </div>

    <div id="sub-controls">
        <button class="sub-btn active" onclick="setSubMode('morning', this)">
            🌅 Morning
            <span class="sub-time">08:00 - 11:00</span>
        </button>
        <button class="sub-btn" onclick="setSubMode('midday', this)">
            ☀️ Midday
            <span class="sub-time">11:00 - 17:00</span>
        </button>
        <button class="sub-btn" onclick="setSubMode('evening', this)">
            🌆 Evening
            <span class="sub-time">17:00 - 22:00</span>
        </button>
    </div>

    <button class="primary" onclick="calculateRun()">Find Best Time</button>

    <div id="result-area"></div>
    
    <a class="bmc" href="https://buymeacoffee.com/willemscharles" target="_blank">☕ Buy me a coffee</a>
</div>

<script>
let selectedLat = null;
let selectedLon = null;
let selectedTimezone = null;
let currentMode = 'asap';
let currentSubMode = 'morning'; 
let debounceTimer;

const input = document.getElementById('city-input');
const suggestionsBox = document.getElementById('suggestions');
const subControls = document.getElementById('sub-controls');

// --- Autocomplete ---
input.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const query = e.target.value;
    if (query.length < 3) { suggestionsBox.style.display = 'none'; return; }
    debounceTimer = setTimeout(async () => {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=5&language=en&format=json`);
        const data = await res.json();
        renderSuggestions(data.results);
    }, 300);
});

function renderSuggestions(results) {
    if (!results) return;
    suggestionsBox.innerHTML = results.map(place => 
        `<div class="suggestion-item" onclick="selectCity('${place.name}', ${place.latitude}, ${place.longitude}, '${place.timezone}')">
            <strong>${place.name}</strong>, ${place.country}
        </div>`
    ).join('');
    suggestionsBox.style.display = 'block';
}

function selectCity(name, lat, lon, timezone) {
    input.value = name;
    selectedLat = lat;
    selectedLon = lon;
    selectedTimezone = timezone;
    suggestionsBox.style.display = 'none';
}

// --- Mode Logic ---
function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    if (mode === '3day') {
        subControls.style.display = 'grid';
    } else {
        subControls.style.display = 'none';
    }
}

function setSubMode(sub, btn) {
    currentSubMode = sub;
    document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

// --- RANDOMIZED WITTY COMMENTS ---
function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function getWittyComment(best, cityNow) {
    const diffHours = (best.timeObj - cityNow) / (1000 * 60 * 60);

    // 1. IS IT NOW? (within 1.5 hours)
    if (diffHours >= 0 && diffHours < 1.5) {
        return pickRandom([
            "Run to your shoes! The window is open NOW.",
            "Stop scrolling, start running.",
            "The pavement is calling. Don't be rude.",
            "GO. GO. GO.",
            "Shoes on. Door open. You got this."
        ]);
    }
    // 2. IS IT RAINING?
    if (best.precip > 20) {
        return pickRandom([
            "Don't worry, sweat is also wet.",
            "You're not made of sugar, you won't melt.",
            "Skin is waterproof. You're fine.",
            "Embrace the soak. It makes you look hardcore.",
            "Think of it as a free shower."
        ]);
    } else if (best.precip > 0) {
        return pickRandom([
            "A little drizzle never hurt anyone.",
            "Just a bit of mist to keep you cool.",
            "Moist. But runnable.",
            "Rain jacket or raw dog it? Up to you."
        ]);
    }
    // 3. IS IT WINDY?
    if (best.wind > 25) {
        return pickRandom([
            "Headwind builds character.",
            "Nature's resistance training.",
            "Hold onto your hat.",
            "If you run fast enough, you ARE the wind.",
            "It's breezy. Good luck."
        ]);
    }
    // 4. IS IT HOT?
    if (best.temp > 22) {
        return pickRandom([
            "It's a warm one. Hydrate or die-drate.",
            "Sweat equity is high today.",
            "Spicy weather. Bring water.",
            "Sun's out, run's out."
        ]);
    }
    // 5. IS IT COLD?
    if (best.temp < 5) {
        return pickRandom([
            "Run fast to stay warm.",
            "If you stop, you freeze. Great motivation!",
            "Be bold, start cold.",
            "Crispy air awaits."
        ]);
    }
    // 6. IS IT PERFECT?
    if (best.temp >= 8 && best.temp <= 14 && best.precip === 0 && best.wind < 15) {
        return pickRandom([
            "Chef's kiss conditions. Literally no excuses.",
            "PB weather. Go get it.",
            "It doesn't get better than this.",
            "God tier running weather.",
            "If you don't run now, you never will."
        ]);
    }
    // 7. GENERIC
    return pickRandom([
        "Your future self will thank you.",
        "Earn that post-run snack.",
        "Clear head, full lungs, can't lose.",
        "Just one foot in front of the other.",
        "Touch grass. Fast."
    ]);
}

// --- Calculation ---
async function calculateRun() {
    const resultArea = document.getElementById('result-area');
    
    if (!selectedLat) {
        resultArea.style.display = 'block';
        resultArea.innerHTML = '<p style="color:red; text-align:center;">Please select a city first.</p>';
        return;
    }

    resultArea.style.display = 'block';
    resultArea.innerHTML = '<p style="color:#64748b; text-align:center;">Analyzing weather & air quality...</p>';

    // 1. Define URLs for Weather and Air Quality
    const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${selectedLat}&longitude=${selectedLon}&hourly=apparent_temperature,precipitation_probability,wind_speed_10m&daily=sunset&timezone=${selectedTimezone}&forecast_days=3`;
    
    // We fetch "european_aqi" (CAQI) which is standard for EU/Global usage in Open-Meteo
    const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${selectedLat}&longitude=${selectedLon}&hourly=european_aqi&timezone=${selectedTimezone}&forecast_days=3`;

    try {
        // 2. Fetch both APIs simultaneously
        const [weatherRes, aqiRes] = await Promise.all([
            fetch(weatherUrl),
            fetch(aqiUrl)
        ]);

        const data = await weatherRes.json();
        const aqiData = await aqiRes.json();
        const cityNow = new Date(new Date().toLocaleString("en-US", { timeZone: selectedTimezone }));

        // 3. Merge Data
        let candidates = data.hourly.time.map((t, i) => {
            const slotTime = new Date(t);
            // Get AQI for this specific hour (handle potential missing data safely)
            const aqiValue = aqiData.hourly && aqiData.hourly.european_aqi ? aqiData.hourly.european_aqi[i] : null;

            return {
                timeObj: slotTime,
                displayTime: slotTime.toLocaleTimeString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }),
                hourVal: slotTime.getHours(),
                temp: data.hourly.apparent_temperature[i],
                precip: data.hourly.precipitation_probability[i],
                wind: data.hourly.wind_speed_10m[i],
                aqi: aqiValue,
                score: 100 - (Math.abs(data.hourly.apparent_temperature[i] - 10) * 2) - (data.hourly.precipitation_probability[i] * 0.8) - (data.hourly.wind_speed_10m[i] * 0.6)
            };
        });

        // Filter past times
        candidates = candidates.filter(c => c.timeObj >= cityNow);

        if (candidates.length === 0) {
            resultArea.innerHTML = '<p style="text-align:center;">No upcoming slots found. Try "Best in 3 Days".</p>';
            return;
        }

        // Apply Modes
        if (currentMode === 'asap') {
            candidates = candidates.slice(0, 24);
        } 
        else if (currentMode === 'tonight') {
            const todayStr = cityNow.toLocaleDateString();
            candidates = candidates.filter(c => {
                return c.timeObj.toLocaleDateString() === todayStr && c.hourVal >= 17 && c.hourVal < 22;
            });
        }
        else if (currentMode === '3day') {
            if (currentSubMode === 'morning') candidates = candidates.filter(c => c.hourVal >= 8 && c.hourVal < 11);
            else if (currentSubMode === 'midday') candidates = candidates.filter(c => c.hourVal >= 11 && c.hourVal < 17);
            else if (currentSubMode === 'evening') candidates = candidates.filter(c => c.hourVal >= 17 && c.hourVal < 22);
        }

        if (candidates.length === 0) {
            resultArea.innerHTML = '<p style="text-align:center;">No matching time slots found.</p>';
            return;
        }

        candidates.sort((a, b) => b.score - a.score);
        const best = candidates[0];
        const comment = getWittyComment(best, cityNow);
        
        // --- BADGE LOGIC ---
        
        // Sunset Badge
        let sunsetHTML = '';
        if (currentMode === 'tonight' || (currentMode === '3day' && currentSubMode === 'evening')) {
            const runDateStr = best.timeObj.toISOString().split('T')[0];
            const dayIndex = data.daily.time.indexOf(runDateStr);
            if (dayIndex !== -1) {
                const sunsetStr = data.daily.sunset[dayIndex];
                const sunsetTime = new Date(sunsetStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                sunsetHTML = `<div class="badge sunset-badge">Sunset: ${sunsetTime}</div>`;
            }
        }

        // Hydration Badge (>20C)
        let hydroHTML = '';
        if (best.temp >= 20) {
            hydroHTML = `<div class="badge hydro-badge">💧 Hydration Req.</div>`;
        }

        // AQI Badge
        let aqiHTML = '';
        if (best.aqi !== null) {
            let aqiClass = 'aqi-good';
            let aqiText = 'Good';
            
            // CAQI Scale: 0-25 v.low, 25-50 low, 50-75 med, 75-100 high
            if (best.aqi < 40) {
                aqiClass = 'aqi-good'; 
                aqiText = `AQI: ${best.aqi} (Clean)`;
            } else if (best.aqi < 65) {
                aqiClass = 'aqi-fair';
                aqiText = `AQI: ${best.aqi} (Fair)`;
            } else {
                aqiClass = 'aqi-poor';
                aqiText = `AQI: ${best.aqi} (Poor)`;
            }
            aqiHTML = `<div class="badge ${aqiClass}">🍃 ${aqiText}</div>`;
        }

        let label = "Top Pick";
        if (currentMode === 'tonight') label = "Best Evening Slot";
        if (currentMode === '3day') label = `Best ${currentSubMode.charAt(0).toUpperCase() + currentSubMode.slice(1)} Run`;

        resultArea.innerHTML = `
            <div class="result-box">
                <div class="tag">${label}</div>
                <div class="time">${best.displayTime}</div>
                <div class="meta">
                    <span>${best.temp.toFixed(1)}°C</span>
                    <span>💧 ${best.precip}%</span>
                    <span>💨 ${best.wind.toFixed(0)}km/h</span>
                </div>
                
                <div class="badges-container">
                    ${aqiHTML}
                    ${hydroHTML}
                    ${sunsetHTML}
                </div>

                <div class="comment">"${comment}"</div>
            </div>
            <button onclick="calculateRun()" style="margin-top:10px; background:white; border:1px solid #ddd;">Refresh</button>
        `;

    } catch (e) {
        console.error(e);
        resultArea.innerHTML = '<p style="color:red; text-align:center;">Error fetching weather/AQI data.</p>';
    }
}
</script>

</body>
</html>
