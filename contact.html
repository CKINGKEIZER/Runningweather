<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RunWeather</title>
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --text: #1e293b; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            max-width: 500px; 
            width: 100%; 
            text-align: center;
        }

        h1 { margin: 0 0 10px; color: var(--secondary); }
        p { color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }

        /* Form Styling */
        form { display: flex; flex-direction: column; gap: 15px; }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            resize: vertical;
        }
        
        input:focus, textarea:focus { outline: none; border-color: var(--secondary); }

        /* Star Rating System */
        .rating-group {
            display: flex;
            justify-content: center;
            flex-direction: row-reverse;
            gap: 5px;
            margin-bottom: 10px;
        }
        .rating-group input { display: none; }
        .rating-group label {
            font-size: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: color 0.2s;
        }
        /* Highlight stars on hover and check */
        .rating-group label:hover,
        .rating-group label:hover ~ label,
        .rating-group input:checked ~ label {
            color: #fbbf24; /* Gold */
        }

        button {
            background: var(--text);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Contact & Feedback</h1>
        <p>Found a bug? Have a feature request? Rate the app and let me know.</p>

        <form action="https://formsubmit.co/contact.runweather@gmail.com" method="POST">
            
            <input type="hidden" name="_next" value="https://www.runweather.org/index.html">
            <input type="hidden" name="_subject" value="New RunWeather Feedback">
            <input type="hidden" name="_captcha" value="false">

            <div class="rating-group">
                <input type="radio" id="star5" name="rating" value="5 Stars"><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4 Stars"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3 Stars"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2 Stars"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1 Star"><label for="star1">★</label>
            </div>

            <input type="text" name="name" placeholder="Your Name (Optional)">
            <input type="email" name="email" placeholder="Your Email (Optional)">
            <textarea name="message" rows="5" placeholder="Your feedback or message..." required></textarea>

            <button type="submit">Send Feedback</button>
        </form>

        <a href="index.html" class="back-link">← Back to Planner</a>
    </div>

</body>
</html>
